<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joyfulpurch — Image to 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0e0f13; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: center; padding: 0 8vw;
  }
  .badge {
    display: inline-block; width: fit-content; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; color: #9fe3c5; padding: 7px 14px;
    border: 1px solid rgba(159,227,197,.35); border-radius: 999px; margin-bottom: 22px;
    backdrop-filter: blur(4px); background: rgba(14,15,19,.35);
  }
  h1 { font-size: clamp(38px, 6vw, 76px); line-height: 1.02; font-weight: 800; color: #fff;
    max-width: 12ch; letter-spacing: -1.5px; text-shadow: 0 4px 40px rgba(0,0,0,.6); }
  h1 .accent { color: #7ee0b0; }
  p.sub { margin-top: 20px; font-size: clamp(15px, 1.5vw, 19px); color: #c7cbd6;
    max-width: 46ch; line-height: 1.5; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  .cta { pointer-events: auto; margin-top: 34px; width: fit-content; display: inline-flex;
    align-items: center; gap: 10px; background: #7ee0b0; color: #0e0f13; font-weight: 700;
    font-size: 16px; padding: 15px 26px; border-radius: 14px; text-decoration: none;
    box-shadow: 0 12px 40px rgba(126,224,176,.28); transition: transform .18s ease, box-shadow .18s ease; }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 16px 50px rgba(126,224,176,.4); }
  .label { position: absolute; bottom: 60px; left: 8vw; font-size: 13px; letter-spacing: 3px;
    text-transform: uppercase; color: #7ee0b0; font-weight: 600; transition: opacity .4s ease; }
  .hint { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 1px; color: #6b7080; text-transform: uppercase; }
  .brand { position: absolute; top: 28px; left: 8vw; font-weight: 800; font-size: 20px;
    color: #fff; letter-spacing: -.5px; }
  .brand span { color: #7ee0b0; }
</style>
</head>
<body>
<div id="app"></div>
<div class="brand">Joyful<span>purch</span></div>
<div class="overlay">
  <span class="badge">Image &rarr; 3D</span>
  <h1>Turn flat photos into <span class="accent">living 3D</span>.</h1>
  <p class="sub">Send us a product image. We hand you an interactive, spinnable 3D model your customers can explore and place in their room.</p>
  <a class="cta" href="/damportugal">See a live demo &rarr;</a>
</div>
<div class="label" id="label">Accent Chair</div>
<div class="hint">Drag to rotate &middot; watch it build</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

const app = document.getElementById('app');
const labelEl = document.getElementById('label');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const COUNT = 30000;
const R = (a,b)=> a + Math.random()*(b-a);
const hx = (h)=>{ const c = new THREE.Color(h); return [c.r,c.g,c.b]; };

const WOOD=hx('#d9b48a'), WOOD2=hx('#c49a68'), WHITE=hx('#f2f0eb'), DARK=hx('#3c3a37'),
  METAL=hx('#2a2b2e'), FABRIC=hx('#9fb0ab'), FABRIC2=hx('#b7c6c1'), SHADE=hx('#f4dca6'),
  TERRA=hx('#c07a4e'), LEAF=hx('#5fae7f'), LEAF2=hx('#7ee0b0'), SOIL=hx('#4a3b30');

function onBox(w,h,d,cx=0,cy=0,cz=0){
  const f=(Math.random()*6)|0; const u=R(-.5,.5), v=R(-.5,.5); let x,y,z;
  if(f===0){x=u*w;y=v*h;z=d/2;} else if(f===1){x=u*w;y=v*h;z=-d/2;}
  else if(f===2){x=w/2;y=v*h;z=u*d;} else if(f===3){x=-w/2;y=v*h;z=u*d;}
  else if(f===4){x=u*w;y=h/2;z=v*d;} else {x=u*w;y=-h/2;z=v*d;}
  return [x+cx,y+cy,z+cz]; }
function onCyl(r,h,cx=0,cy=0,cz=0,rTop=null){
  rTop=rTop==null?r:rTop; const a=R(0,Math.PI*2), t=R(0,1), rr=r+(rTop-r)*t;
  return [cx+Math.cos(a)*rr, cy-h/2+t*h, cz+Math.sin(a)*rr]; }
function onDisc(r,cx=0,cy=0,cz=0){ const a=R(0,Math.PI*2), rr=Math.sqrt(Math.random())*r;
  return [cx+Math.cos(a)*rr, cy, cz+Math.sin(a)*rr]; }
function onCone(r,h,cx=0,cy=0,cz=0){ const a=R(0,Math.PI*2), t=R(0,1), rr=r*(1-t);
  return [cx+Math.cos(a)*rr, cy+t*h, cz+Math.sin(a)*rr]; }
function onSphere(r,cx=0,cy=0,cz=0){ const u=R(0,Math.PI*2), v=Math.acos(R(-1,1)), rr=r*(0.55+0.45*Math.random());
  return [cx+rr*Math.sin(v)*Math.cos(u), cy+rr*Math.cos(v), cz+rr*Math.sin(v)*Math.sin(u)]; }

function chair(){ const r=Math.random();
  if(r<0.16) return {p:onBox(2.0,0.24,2.0,0,-0.2,0), c:WOOD};
  if(r<0.44) return {p:onBox(2.0,2.2,0.24,0,1.0,-0.88), c:WOOD};
  const sx=Math.random()<.5?-1:1, sz=Math.random()<.5?-1:1;
  return {p:onBox(0.22,2.0,0.22,sx*0.8,-1.3,sz*0.8), c:DARK}; }
function sofa(){ const r=Math.random();
  if(r<0.34) return {p:onBox(4.2,0.9,1.8,0,-0.5,0), c:FABRIC};
  if(r<0.52) return {p:onBox(4.2,1.2,0.4,0,0.5,-0.7), c:FABRIC};
  if(r<0.70){ const cx=[-1.3,0,1.3][(Math.random()*3)|0]; return {p:onBox(1.15,0.32,1.5,cx,0.15,0.1), c:FABRIC2}; }
  if(r<0.88){ const s=Math.random()<.5?-2.05:2.05; return {p:onBox(0.5,1.1,1.8,s,0,0), c:FABRIC}; }
  const s=Math.random()<.5?-1.9:1.9, z=Math.random()<.5?-0.8:0.8;
  return {p:onBox(0.2,0.5,0.2,s,-1.15,z), c:DARK}; }
function lamp(){ const r=Math.random();
  if(r<0.12) return {p:onDisc(0.85,0,-2.5,0), c:METAL};
  if(r<0.45) return {p:onCyl(0.07,4.2,0,-0.4,0), c:METAL};
  return {p:onCone(1.15,1.4,0,2.0,0), c:SHADE}; }
function shelf(){ const r=Math.random();
  if(r<0.40){ const s=Math.random()<.5?-1.7:1.7; return {p:onBox(0.2,4.2,1.4,s,0,0), c:WOOD2}; }
  const y=[-2.0,-0.7,0.7,2.0][(Math.random()*4)|0];
  const col=(y>0&&Math.random()<0.25)?LEAF2:WOOD; return {p:onBox(3.6,0.16,1.4,0,y,0), c:col}; }
function roundTable(){ const r=Math.random();
  if(r<0.34) return {p:onDisc(2.1,0,1.2,0), c:WOOD};
  if(r<0.46) return {p:onCyl(2.1,0.24,0,1.06,0), c:WOOD2};
  if(r<0.66) return {p:onCyl(0.3,2.2,0,0.0,0), c:WOOD2};
  return {p:onDisc(1.1,0,-1.05,0), c:WOOD2}; }
function plant(){ const r=Math.random();
  if(r<0.24) return {p:onCyl(0.6,1.5,0,-1.7,0,0.95), c:TERRA};
  if(r<0.32) return {p:onDisc(0.85,0,-0.95,0), c:SOIL};
  if(r<0.40) return {p:onCyl(0.06,1.2,0,-0.2,0), c:LEAF};
  const col=Math.random()<0.35?LEAF2:LEAF; return {p:onSphere(1.5,0,0.7,0), c:col}; }
function nightstand(){ const r=Math.random();
  if(r<0.55){ const p=onBox(3.0,2.2,3.0,0,0.4,0); const c=p[2]>1.4?WHITE:WOOD; return {p,c}; }
  if(r<0.66) return {p:onBox(3.0,0.06,3.0,0,1.5,0), c:WOOD};
  const s=Math.random()<.5?-1.1:1.1, z=Math.random()<.5?-1.1:1.1;
  return {p:onBox(0.28,1.4,0.28,s,-1.4,z), c:WHITE}; }

const SHAPES=[
  {name:'Accent Chair',fn:chair},{name:'Sofa',fn:sofa},{name:'Floor Lamp',fn:lamp},
  {name:'Bookshelf',fn:shelf},{name:'Round Table',fn:roundTable},
  {name:'Potted Plant',fn:plant},{name:'Nightstand',fn:nightstand},
];
function makeShape(fn){ const pos=new Float32Array(COUNT*3), col=new Float32Array(COUNT*3);
  for(let i=0;i<COUNT;i++){ const o=fn(), i3=i*3;
    pos[i3]=o.p[0];pos[i3+1]=o.p[1];pos[i3+2]=o.p[2];
    col[i3]=o.c[0];col[i3+1]=o.c[1];col[i3+2]=o.c[2]; } return {pos,col}; }
const built=SHAPES.map(s=>makeShape(s.fn));

const FRAME_C=hx('#aeb7c2'), SUN_C=hx('#e9edf1'), MTN_C=hx('#c4ccd6'), MTN2_C=hx('#b3bcc8');
const FS=0.5; const halfW=6.2, halfH=4.2, bottom=-3.6;
function silhouette(x){ const g=(peak,x0,sp)=> bottom+(peak-bottom)*Math.exp(-((x-x0)*(x-x0))/(2*sp*sp));
  return Math.max(bottom+0.01, g(-1.0,-4.0,1.7), g(1.5,1.8,3.0)); }
const flatPos=new Float32Array(COUNT*3), flatCol=new Float32Array(COUNT*3);
for(let i=0;i<COUNT;i++){ const i3=i*3; let x,y,z=R(-0.12,0.12), c; const r=Math.random();
  if(r<0.26){ const e=(Math.random()*4)|0, th=R(0,0.28);
    if(e===0){x=R(-halfW,halfW);y=halfH-th;} else if(e===1){x=R(-halfW,halfW);y=-halfH+th;}
    else if(e===2){x=-halfW+th;y=R(-halfH,halfH);} else {x=halfW-th;y=R(-halfH,halfH);} c=FRAME_C;
  } else if(r<0.40){ const a=R(0,Math.PI*2), rr=Math.sqrt(Math.random())*0.95;
    x=-2.9+Math.cos(a)*rr; y=1.7+Math.sin(a)*rr; c=SUN_C;
  } else { x=R(-halfW,halfW); const top=silhouette(x); y=R(bottom,top);
    c=(y>(top+bottom)/2)?MTN_C:MTN2_C; }
  flatPos[i3]=x*FS;flatPos[i3+1]=y*FS;flatPos[i3+2]=z*FS;
  flatCol[i3]=c[0];flatCol[i3+1]=c[1];flatCol[i3+2]=c[2]; }

const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(flatPos),3));
geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(flatCol),3));
const mat=new THREE.PointsMaterial({size:0.03,vertexColors:true,transparent:true,opacity:0.95,depthWrite:false});
const cloud=new THREE.Points(geo,mat); scene.add(cloud);
const P=geo.attributes.position.array, C=geo.attributes.color.array;

let dragX=0,dragY=0,autoY=0,dragging=false,px=0,py=0,autoOn=true,sx=0,sy=0;
let nmx=0,nmy=0,magT=0,mag=0;
const el=renderer.domElement;
const down=(x,y)=>{dragging=true;autoOn=false;px=x;py=y;};
const move=(x,y)=>{ if(!dragging)return; sx+=(x-px)*0.006; sy+=(y-py)*0.004; px=x; py=y; };
const track=(x,y)=>{ nmx=(x/innerWidth)*2-1; nmy=-(y/innerHeight)*2+1; magT=1; };
const up=()=>{dragging=false; setTimeout(()=>autoOn=true,2500);};
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>{ move(e.clientX,e.clientY); track(e.clientX,e.clientY); });
addEventListener('mouseup',up);
el.addEventListener('mouseleave',()=>magT=0);
el.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);track(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
addEventListener('touchmove',e=>{ move(e.touches[0].clientX,e.touches[0].clientY); track(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
addEventListener('touchend',()=>{up();magT=0;});
const _v=new THREE.Vector3(), _w=new THREE.Vector3();

let t=0, prev=0, idx=SHAPES.length-1, prevM=-1, magPrev=0;
const ease=x=> x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const RAD=0.6, RAD2=RAD*RAD, S=1.15;
function animate(){ requestAnimationFrame(animate);
  t+=0.0022; const cyc=t%1;
  if(cyc<prev){ idx=(idx+1)%SHAPES.length; labelEl.textContent=SHAPES[idx].name; } prev=cyc;
  let m; if(cyc<0.30)m=ease(cyc/0.30); else if(cyc<0.62)m=1;
  else if(cyc<0.82)m=1-ease((cyc-0.62)/0.20); else m=0;

  if(autoOn) autoY+=0.0032;
  dragX+=(sx-dragX)*0.08; dragY+=(sy-dragY)*0.08;
  mag+=(magT-mag)*0.09;
  cloud.rotation.y=dragX+autoY; cloud.rotation.x=dragY*0.7+0.06*Math.sin(t*2);
  cloud.updateMatrixWorld();

  _v.set(nmx,nmy,0.5).unproject(camera).sub(camera.position).normalize();
  const dd=-camera.position.z/_v.z;
  _w.copy(camera.position).add(_v.multiplyScalar(dd)); cloud.worldToLocal(_w);
  const lx=_w.x, ly=_w.y, lz=_w.z, K=S*mag;

  const activeFrame = (m!==prevM) || (mag>0.002) || (magPrev>0.002);
  if(activeFrame){ const sp=built[idx].pos, sc=built[idx].col, colDirty=(m!==prevM);
    for(let i=0;i<COUNT;i++){ const i3=i*3;
      let bx=flatPos[i3]+(sp[i3]-flatPos[i3])*m;
      let by=flatPos[i3+1]+(sp[i3+1]-flatPos[i3+1])*m;
      let bz=flatPos[i3+2]+(sp[i3+2]-flatPos[i3+2])*m;
      if(K>0.002){ const ex=bx-lx, ey=by-ly, ez=bz-lz, d2=ex*ex+ey*ey+ez*ez;
        if(d2<RAD2){ const d=Math.sqrt(d2)||1e-4, f=1-d/RAD, b=f*f*K/d; bx+=ex*b; by+=ey*b; bz+=ez*b; } }
      P[i3]=bx; P[i3+1]=by; P[i3+2]=bz;
      if(colDirty){ C[i3]=flatCol[i3]+(sc[i3]-flatCol[i3])*m;
        C[i3+1]=flatCol[i3+1]+(sc[i3+1]-flatCol[i3+1])*m;
        C[i3+2]=flatCol[i3+2]+(sc[i3+2]-flatCol[i3+2])*m; } }
    geo.attributes.position.needsUpdate=true;
    if(colDirty) geo.attributes.color.needsUpdate=true;
  }
  labelEl.style.opacity=0.25+0.65*m;
  prevM=m; magPrev=mag;
  renderer.render(scene,camera); }
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
